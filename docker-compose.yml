services:
  jekyll:
    build:
      context: .
      target: build
    ports:
      - "4000:4000"
      - "35729:35729"
    working_dir: /app
    volumes:
      - .:/app:cached
      - /app/.sass-cache
      - /app/.jekyll-cache
      - /app/apps/dnd/node_modules
    command:
      - sh
      - -c
      - >-
        npm --prefix apps/dnd ci &&
        bundle exec rake dnd:build &&
        bundle exec jekyll serve --host 0.0.0.0 --port 4000 --livereload --livereload-port 35729 --force_polling --verbose